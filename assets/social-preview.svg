      <text x="22" y="38" font-size="18.5" font-weight="800" fill="#9D174D">Mountless SFTP VFS</text>
      <text x="22" y="66" font-size="15.5" fill="#475569">Zero FUSE or shell bugs</text>

      <rect x="260" y="0" width="244" height="94" rx="22" fill="#FFFFFF" stroke="#FDBA74" stroke-width="2.5"/>
      <text x="282" y="38" font-size="18.5" font-weight="800" fill="#9A3412">Auto-Detach &gt;5s</text>
      <text x="282" y="66" font-size="15.5" fill="#475569">Survives Wi-Fi drops</text>

      <rect x="0" y="110" width="244" height="94" rx="22" fill="#FFFFFF" stroke="#86EFAC" stroke-width="2.5"/>
      <text x="22" y="148" font-size="18.5" font-weight="800" fill="#166534">Sub-1ms UDP Mesh</text>
      <text x="22" y="176" font-size="15.5" fill="#475569">Auto IP on Hotspot &amp; USB</text>

      <rect x="260" y="110" width="244" height="94" rx="22" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2.5"/>
      <text x="282" y="148" font-size="18.5" font-weight="800" fill="#1E40AF">PAM Agent Sudo</text>
      <text x="282" y="176" font-size="15.5" fill="#475569">SSH key verified root</text>
    </g>

    <text x="68" y="582" font-size="21" font-weight="800" fill="#334155">github.com/0xOpCode/sysbridge-mcp</text>
