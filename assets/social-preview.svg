<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="socSky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF9F5"/>
      <stop offset="50%" stop-color="#FFF0F5"/>
      <stop offset="100%" stop-color="#F0F9FF"/>
    </linearGradient>
    <radialGradient id="socSun" cx="73%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.72"/>
