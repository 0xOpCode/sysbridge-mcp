<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
  <defs>
    <linearGradient id="kawaiiSky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF9F5"/>
      <stop offset="48%" stop-color="#FFF0F5"/>
      <stop offset="100%" stop-color="#F0F9FF"/>
    </linearGradient>

    <radialGradient id="sunAura" cx="72%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.75"/>
      <stop offset="55%" stop-color="#FBCFE8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFF9F5" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rainbowBridge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF9EBB"/>
      <stop offset="35%" stop-color="#FFC085"/>
      <stop offset="70%" stop-color="#8CE99A"/>
      <stop offset="100%" stop-color="#85D8FF"/>
    </linearGradient>

    <linearGradient id="pastelWater" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="50%" stop-color="#D8F3DC"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
  </defs>

  <!-- Soft Rounded Kawaii Frame -->
  <rect width="1280" height="400" rx="28" fill="url(#kawaiiSky)"/>
  <rect x="6" y="6" width="1268" height="388" rx="24" fill="none" stroke="#FBCFE8" stroke-width="3"/>
  <circle cx="920" cy="185" r="240" fill="url(#sunAura)"/>

  <!-- Background Pastel Hills on Right -->
  <path d="M 520 400 Q 740 270 960 320 T 1280 285 L 1280 400 Z" fill="#EDE9FE" fill-opacity="0.8"/>
  <path d="M 560 400 Q 820 305 1040 345 T 1280 325 L 1280 400 Z" fill="#DCFCE7" fill-opacity="0.85"/>
  <path d="M 590 400 Q 860 345 1100 365 T 1280 355 L 1280 400 Z" fill="url(#pastelWater)"/>

  <!-- Four-Point Kawaii Star Sparkles -->
  <g fill="#FBBF24">
    <path d="M 625 68 Q 625 82 639 82 Q 625 82 625 96 Q 625 82 611 82 Q 625 82 625 68 Z"/>
    <path d="M 1185 62 Q 1185 74 1197 74 Q 1185 74 1185 86 Q 1185 74 1173 74 Q 1185 74 1185 62 Z"/>
    <path d="M 885 42 Q 885 51 894 51 Q 885 51 885 60 Q 885 51 876 51 Q 885 51 885 42 Z" fill="#F472B6"/>
    <circle cx="670" cy="54" r="5" fill="#F9A8D4"/>
    <circle cx="1050" cy="55" r="5" fill="#93C5FD"/>
    <circle cx="575" cy="145" r="4.5" fill="#86EFAC"/>
  </g>

  <!-- Cute Smiling Fluffy Cloud (Top Center-Right) -->
  <g transform="translate(690, 44)">
    <path d="M 20 52 C 5 52 0 36 14 28 C 22 10 50 8 62 24 C 78 16 98 28 96 44 C 108 46 108 58 94 58 L 20 58 Z" fill="#FFFFFF" stroke="#475569" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="44" cy="39" r="2.6" fill="#334155"/>
    <circle cx="64" cy="39" r="2.6" fill="#334155"/>
    <ellipse cx="37" cy="43" rx="4.5" ry="2.5" fill="#FDA4AF"/>
    <ellipse cx="71" cy="43" rx="4.5" ry="2.5" fill="#FDA4AF"/>
    <path d="M 50 42 Q 54 46 58 42" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- ==================== LEFT SIDE: KAWAII TYPOGRAPHY & CANDY PILLS ==================== -->
  <g font-family="'DejaVu Sans', 'Segoe UI', sans-serif">
    <!-- Top Cute Pill Badges -->
    <g transform="translate(56, 46)">
      <rect x="0" y="0" width="142" height="34" rx="17" fill="#FCE7F3" stroke="#F472B6" stroke-width="2"/>
      <text x="71" y="22" text-anchor="middle" font-size="13.5" font-weight="800" fill="#9D174D" letter-spacing="0.8">ZERO INSTALL</text>

      <rect x="154" y="0" width="124" height="34" rx="17" fill="#DCFCE7" stroke="#4ADE80" stroke-width="2"/>
      <text x="216" y="22" text-anchor="middle" font-size="13.5" font-weight="800" fill="#166534" letter-spacing="0.8">GOLANG</text>

      <rect x="290" y="0" width="152" height="34" rx="17" fill="#EDE9FE" stroke="#A78BFA" stroke-width="2"/>
      <text x="366" y="22" text-anchor="middle" font-size="13.5" font-weight="800" fill="#5B21B6" letter-spacing="0.8">MCP SERVER</text>
    </g>

    <!-- Title with Soft Pastel Shadow -->
    <text x="59" y="153" font-size="64" font-weight="800" fill="#F9A8D4" letter-spacing="-1.5">sysbridge-mcp</text>
    <text x="56" y="150" font-size="64" font-weight="800" fill="#1E293B" letter-spacing="-1.5">sysbridge-mcp</text>

    <!-- Subtitle -->
    <text x="56" y="194" font-size="21" font-weight="700" fill="#334155">One AI agent. Every machine you own.</text>
    <text x="56" y="224" font-size="15" fill="#64748B">Mountless SFTP VFS, detached tmux builds &amp; P2P UDP mesh</text>

    <!-- 2x2 Kawaii Feature Sticker Pills -->
    <g transform="translate(56, 254)">
      <!-- Sticker 1 -->
      <rect x="0" y="0" width="236" height="50" rx="25" fill="#FFFFFF" stroke="#F9A8D4" stroke-width="2.5"/>
      <circle cx="28" cy="25" r="14" fill="#FCE7F3"/>
      <text x="28" y="30" text-anchor="middle" font-size="14" font-weight="800" fill="#BE185D">FS</text>
      <text x="52" y="31" font-size="15.5" font-weight="700" fill="#334155">Mountless SFTP VFS</text>

      <!-- Sticker 2 -->
      <rect x="250" y="0" width="236" height="50" rx="25" fill="#FFFFFF" stroke="#FDBA74" stroke-width="2.5"/>
      <circle cx="278" cy="25" r="14" fill="#FFEDD5"/>
      <text x="278" y="30" text-anchor="middle" font-size="14" font-weight="800" fill="#C2410C">5s</text>
      <text x="302" y="31" font-size="15.5" font-weight="700" fill="#334155">Auto-Detach Tmux</text>

      <!-- Sticker 3 -->
      <rect x="0" y="62" width="236" height="50" rx="25" fill="#FFFFFF" stroke="#86EFAC" stroke-width="2.5"/>
      <circle cx="28" cy="87" r="14" fill="#DCFCE7"/>
      <text x="28" y="92" text-anchor="middle" font-size="13" font-weight="800" fill="#15803D">P2P</text>
      <text x="52" y="93" font-size="15.5" font-weight="700" fill="#334155">Sub-1ms UDP Mesh</text>

      <!-- Sticker 4 -->
      <rect x="250" y="62" width="236" height="50" rx="25" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2.5"/>
      <circle cx="278" cy="87" r="14" fill="#DBEAFE"/>
      <text x="278" y="92" text-anchor="middle" font-size="13" font-weight="800" fill="#1D4ED8">KEY</text>
      <text x="302" y="93" font-size="15.5" font-weight="700" fill="#334155">PAM SSH Key Sudo</text>
    </g>
  </g>

  <!-- ==================== RIGHT SIDE: KAWAII BRIDGE & MASCOTS ILLUSTRATION ==================== -->
  <g transform="translate(595, 25)">
    <!-- Soft Sun Behind Bridge -->
    <circle cx="330" cy="165" r="88" fill="#FEF3C7" stroke="#FDE68A" stroke-width="3"/>

    <!-- Arched Rainbow Bridge -->
    <path d="M 135 295 L 135 190 Q 330 105 525 190 L 525 295 L 485 295 A 52 58 0 0 0 380 295 L 358 295 A 45 66 0 0 0 302 295 L 280 295 A 52 58 0 0 0 175 295 Z" fill="#FFFDF9" stroke="#334155" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 118 192 Q 330 102 542 192" fill="none" stroke="url(#rainbowBridge)" stroke-width="14" stroke-linecap="round"/>
    <path d="M 122 184 Q 330 94 538 184" fill="none" stroke="#334155" stroke-width="2.8" stroke-linecap="round"/>

    <!-- Cute Hanging Star Lanterns on Bridge -->
    <line x1="230" y1="154" x2="230" y2="128" stroke="#334155" stroke-width="2.5"/>
    <circle cx="230" cy="122" r="8" fill="#FEF08A" stroke="#334155" stroke-width="2.2"/>
    <line x1="330" y1="138" x2="330" y2="108" stroke="#334155" stroke-width="2.5"/>
    <circle cx="330" cy="102" r="9.5" fill="#FEF08A" stroke="#334155" stroke-width="2.2"/>
    <line x1="430" y1="154" x2="430" y2="128" stroke="#334155" stroke-width="2.5"/>
    <circle cx="430" cy="122" r="8" fill="#FEF08A" stroke="#334155" stroke-width="2.2"/>

    <!-- Cute Paper Airplane Gliding Over Bridge -->
    <g transform="translate(295, 58)">
      <polygon points="0,24 46,8 24,38 18,26" fill="#FBCFE8" stroke="#334155" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M -38 36 Q -18 28 -6 25" fill="none" stroke="#F472B6" stroke-width="2.5" stroke-dasharray="5 5" stroke-linecap="round"/>
    </g>

    <!-- LEFT ISLAND: Kawaii Pocket Bot (Phone / Termux) -->
    <g transform="translate(15, 145)">
      <ellipse cx="95" cy="165" rx="88" ry="26" fill="#FFEDD5" stroke="#334155" stroke-width="2.8"/>
      <ellipse cx="95" cy="160" rx="72" ry="18" fill="#FEF3C7"/>

      <!-- Cute Sprout on Left Island -->
      <path d="M 22 152 Q 8 128 28 118 Q 38 134 22 152 Z" fill="#86EFAC" stroke="#334155" stroke-width="2"/>

      <!-- Kawaii Pocket Phone Body -->
      <rect x="44" y="28" width="102" height="134" rx="24" fill="#FFFFFF" stroke="#334155" stroke-width="3.2"/>
      <rect x="54" y="42" width="82" height="98" rx="16" fill="#FFF1F2" stroke="#F472B6" stroke-width="2.2"/>

      <!-- Cute Antenna on Top of Phone -->
      <line x1="95" y1="28" x2="95" y2="12" stroke="#334155" stroke-width="3"/>
      <circle cx="95" cy="9" r="7" fill="#FF9EBB" stroke="#334155" stroke-width="2.4"/>

      <!-- Kawaii Mochi Agent Face Inside Screen -->
      <circle cx="95" cy="84" r="26" fill="#FEF08A" stroke="#334155" stroke-width="2.5"/>
      <circle cx="85" cy="80" r="3.5" fill="#1E293B"/>
      <circle cx="105" cy="80" r="3.5" fill="#1E293B"/>
      <circle cx="83.8" cy="78.8" r="1.2" fill="#FFFFFF"/>
      <circle cx="103.8" cy="78.8" r="1.2" fill="#FFFFFF"/>
      <ellipse cx="77" cy="86" rx="5" ry="2.8" fill="#FB7185"/>
      <ellipse cx="113" cy="86" rx="5" ry="2.8" fill="#FB7185"/>
      <path d="M 89 86 Q 95 92 101 86" fill="none" stroke="#1E293B" stroke-width="2.3" stroke-linecap="round"/>

      <!-- Island Label Pill -->
      <rect x="23" y="172" width="144" height="30" rx="15" fill="#FFFFFF" stroke="#334155" stroke-width="2.4"/>
      <text x="95" y="192" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="13.5" font-weight="800" fill="#9A3412">Pocket Agent</text>
    </g>

    <!-- RIGHT ISLAND: Kawaii Workstation & Plush Mochi Companion -->
    <g transform="translate(455, 145)">
      <ellipse cx="105" cy="165" rx="96" ry="26" fill="#D1FAE5" stroke="#334155" stroke-width="2.8"/>
      <ellipse cx="105" cy="160" rx="78" ry="18" fill="#E0F2FE"/>

      <!-- Kawaii Monitor -->
      <rect x="34" y="34" width="142" height="102" rx="20" fill="#FFFFFF" stroke="#334155" stroke-width="3.2"/>
      <rect x="46" y="46" width="118" height="76" rx="12" fill="#EEF2FF" stroke="#818CF8" stroke-width="2.2"/>

      <!-- Cute Pastel Code & Heart Blocks Inside Monitor -->
      <rect x="56" y="56" width="46" height="24" rx="6" fill="#FCE7F3" stroke="#F472B6" stroke-width="1.8"/>
      <rect x="108" y="56" width="46" height="24" rx="6" fill="#DCFCE7" stroke="#4ADE80" stroke-width="1.8"/>
      <rect x="56" y="88" width="98" height="22" rx="6" fill="#FEF3C7" stroke="#FBBF24" stroke-width="1.8"/>

      <!-- Kawaii Eyes & Smile on Monitor Bezel / Companion -->
      <circle cx="92" cy="100" r="2.8" fill="#1E293B"/>
      <circle cx="118" cy="100" r="2.8" fill="#1E293B"/>
      <ellipse cx="85" cy="103" rx="4" ry="2.2" fill="#FB7185"/>
      <ellipse cx="125" cy="103" rx="4" ry="2.2" fill="#FB7185"/>
      <path d="M 101 101 Q 105 105 109 101" fill="none" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/>

      <!-- Monitor Stand -->
      <path d="M 90 136 L 82 158 L 128 158 L 120 136 Z" fill="#CBD5E1" stroke="#334155" stroke-width="2.8" stroke-linejoin="round"/>
      <rect x="68" y="158" width="74" height="8" rx="4" fill="#94A3B8" stroke="#334155" stroke-width="2.4"/>

      <!-- Island Label Pill -->
      <rect x="23" y="172" width="164" height="30" rx="15" fill="#FFFFFF" stroke="#334155" stroke-width="2.4"/>
      <text x="105" y="192" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="13.5" font-weight="800" fill="#065F46">Linux PC / Cloud VPS</text>
    </g>
  </g>
</svg>
