    <text x="130" y="191" text-anchor="middle" font-size="14.5" font-weight="700" fill="#065F46">Linux Desktop &amp; Sway</text>

    <rect x="24" y="214" width="212" height="36" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.8"/>
    <text x="130" y="237" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1E40AF">Cloud VPS &amp; Homelabs</text>

    <rect x="24" y="260" width="212" height="36" rx="14" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.8"/>
    <text x="130" y="283" text-anchor="middle" font-size="14.5" font-weight="700" fill="#9A3412">macOS &amp; Pocket Nodes</text>

    <text x="130" y="318" text-anchor="middle" font-size="13" font-weight="800" fill="#059669">Zero Remote Install Default</text>
