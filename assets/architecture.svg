<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" width="1080" height="520" fill="none">
  <defs>
    <linearGradient id="arch-bg" x1="0" y1="0" x2="1080" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0B0F17"/>
    </linearGradient>
    <pattern id="arch-grid" width="28" height="28" patternUnits="userSpaceOnUse">
