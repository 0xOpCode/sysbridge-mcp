      <text x="28" y="24" font-size="11" font-weight="700" fill="#F8FAFC">Cloud VPS / Linux</text>
      <text x="16" y="42" font-size="9.5" fill="#94A3B8">apt / dnf / apk / journalctl</text>
      <text x="16" y="56" font-size="9.5" fill="#F59E0B">Zero Agent Daemon Req.</text>
