    <text x="540" y="52" text-anchor="middle" font-size="20" font-weight="800" fill="#1E293B">How sysbridge-mcp Connects Your Worlds</text>
  </g>

  <!-- Cute Smiling Cloud Left & Right -->
  <g transform="translate(88, 30)">
    <path d="M 16 42 C 4 42 0 28 12 22 C 18 8 40 6 50 18 C 64 12 80 22 78 35 L 16 35 Z" fill="#FFFFFF" stroke="#475569" stroke-width="2.2"/>
