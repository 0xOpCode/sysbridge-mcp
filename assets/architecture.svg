    <text x="40" y="237" font-size="15.5" font-weight="800" fill="#065F46">7-Stage Zero-Hunt Mesh</text>
    <text x="40" y="258" font-size="13.5" fill="#475569">UDP :42424 • Netlink • USB/Wi-Fi</text>

    <rect x="22" y="282" width="256" height="64" rx="16" fill="#EFF6FF" stroke="#60A5FA" stroke-width="2"/>
    <text x="40" y="307" font-size="15.5" font-weight="800" fill="#1E40AF">Safety &amp; Key Sudo Guard</text>
    <text x="40" y="328" font-size="13.5" fill="#475569">/dev/sda blocker • PAM SSH key</text>
  </g>

