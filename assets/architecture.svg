    <text x="40" y="118" font-size="13.5" fill="#475569">sftp-vfs • ssh-stream • local</text>

    <rect x="22" y="142" width="256" height="58" rx="16" fill="#FFFBEB" stroke="#FBBF24" stroke-width="2"/>
    <text x="40" y="167" font-size="15.5" font-weight="800" fill="#92400E">Adaptive Runner (&gt;5s)</text>
