      <circle cx="18" cy="26" r="4" fill="#38BDF8"/>
      <text x="32" y="23" font-size="12" font-weight="700" fill="#F8FAFC">Claude Code</text>
      <text x="32" y="39" font-size="10" fill="#94A3B8">CLI / Desktop MCP</text>
