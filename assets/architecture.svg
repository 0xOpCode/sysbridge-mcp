    <circle cx="36" cy="27" r="2.2" fill="#334155"/>
    <circle cx="52" cy="27" r="2.2" fill="#334155"/>
    <ellipse cx="30" cy="30" rx="3.5" ry="2" fill="#FDA4AF"/>
    <ellipse cx="58" cy="30" rx="3.5" ry="2" fill="#FDA4AF"/>
    <path d="M 41 29 Q 44 33 47 29" fill="none" stroke="#334155" stroke-width="1.8" stroke-linecap="round"/>
