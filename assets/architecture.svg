    <text x="130" y="237" text-anchor="middle" font-size="14.5" font-weight="700" fill="#581C87">Cursor, Windsurf &amp; Zed</text>

    <rect x="24" y="260" width="212" height="36" rx="14" fill="#FEF3C7" stroke="#FBBF24" stroke-width="1.8"/>
    <text x="130" y="283" text-anchor="middle" font-size="14.5" font-weight="700" fill="#78350F">Android Termux &amp; n8n</text>

    <text x="130" y="318" text-anchor="middle" font-size="13" font-weight="700" fill="#64748B">stdio • HTTP • SSE • Unix</text>
  </g>

