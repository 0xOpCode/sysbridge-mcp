    <circle cx="146" cy="100" r="4" fill="#1E293B"/>
    <circle cx="112.5" cy="98.5" r="1.4" fill="#FFFFFF"/>
    <circle cx="144.5" cy="98.5" r="1.4" fill="#FFFFFF"/>
    <ellipse cx="104" cy="108" rx="6" ry="3.2" fill="#FB7185"/>
    <ellipse cx="156" cy="108" rx="6" ry="3.2" fill="#FB7185"/>
    <path d="M 122 108 Q 130 116 138 108" fill="none" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 118 140 L 110 154 L 150 154 L 142 140 Z" fill="#CBD5E1" stroke="#334155" stroke-width="2.5"/>

