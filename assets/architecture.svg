<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="540" viewBox="0 0 1080 540">
  <defs>
    <linearGradient id="archBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF9F5"/>
      <stop offset="50%" stop-color="#FDF4FF"/>
      <stop offset="100%" stop-color="#F0F9FF"/>
    </linearGradient>
    <linearGradient id="rainbowTrack" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF9EBB"/>
      <stop offset="35%" stop-color="#FFC085"/>
      <stop offset="70%" stop-color="#8CE99A"/>
      <stop offset="100%" stop-color="#85D8FF"/>
    </linearGradient>
  </defs>

  <!-- Kawaii Storybook Frame -->
  <rect width="1080" height="540" rx="28" fill="url(#archBg)"/>
  <rect x="6" y="6" width="1068" height="528" rx="24" fill="none" stroke="#FBCFE8" stroke-width="3"/>

  <!-- Pastel Rolling Hills at Bottom -->
  <path d="M 0 455 Q 270 395 540 435 T 1080 415 L 1080 540 L 0 540 Z" fill="#EDE9FE" fill-opacity="0.7"/>
  <path d="M 0 485 Q 320 445 640 475 T 1080 465 L 1080 540 L 0 540 Z" fill="#DCFCE7" fill-opacity="0.8"/>

  <!-- Header Banner -->
  <g font-family="'DejaVu Sans', 'Segoe UI', sans-serif">
