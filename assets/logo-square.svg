  <path d="M 120 96 Q 120 112 136 112 Q 120 112 120 128 Q 120 112 104 112 Q 120 112 120 96 Z" fill="#FBBF24"/>
  <path d="M 392 92 Q 392 106 406 106 Q 392 106 392 120 Q 392 106 378 106 Q 392 106 392 92 Z" fill="#F472B6"/>
  <circle cx="256" cy="78" r="7" fill="#60A5FA"/>

  <!-- Pastel Hills & River -->
  <path d="M 24 385 Q 150 330 256 360 T 488 350 L 488 420 Q 488 488 410 488 L 102 488 Q 24 488 24 420 Z" fill="#E0F2FE"/>

  <!-- Cute Rainbow Bridge -->
  <path d="M 105 345 L 105 245 Q 256 165 407 245 L 407 345 L 365 345 A 42 52 0 0 0 285 345 L 227 345 A 42 52 0 0 0 147 345 Z" fill="#FFFFFF" stroke="#334155" stroke-width="5" stroke-linejoin="round"/>
  <path d="M 92 248 Q 256 160 420 248" fill="none" stroke="url(#logoRainbow)" stroke-width="20" stroke-linecap="round"/>
  <path d="M 96 238 Q 256 150 416 238" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round"/>

  <!-- Left Mochi Companion (Peach/Pink) -->
  <g transform="translate(68, 250)">
    <rect x="0" y="0" width="112" height="102" rx="46" fill="#FCE7F3" stroke="#334155" stroke-width="5"/>
    <circle cx="40" cy="48" r="5.5" fill="#1E293B"/>
    <circle cx="72" cy="48" r="5.5" fill="#1E293B"/>
    <ellipse cx="28" cy="56" rx="8" ry="4.5" fill="#FB7185"/>
    <ellipse cx="84" cy="56" rx="8" ry="4.5" fill="#FB7185"/>
    <path d="M 48 56 Q 56 64 64 56" fill="none" stroke="#1E293B" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Right Mochi Companion (Mint/Sky) -->
  <g transform="translate(332, 250)">
    <rect x="0" y="0" width="112" height="102" rx="46" fill="#D1FAE5" stroke="#334155" stroke-width="5"/>
    <circle cx="40" cy="48" r="5.5" fill="#1E293B"/>
    <circle cx="72" cy="48" r="5.5" fill="#1E293B"/>
    <ellipse cx="28" cy="56" rx="8" ry="4.5" fill="#FB7185"/>
