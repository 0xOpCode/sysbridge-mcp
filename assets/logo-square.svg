<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0B0F17"/>
    </linearGradient>
    <linearGradient id="beam-amber" x1="120" y1="256" x2="392" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="hex-left" x1="64" y1="152" x2="216" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="hex-right" x1="296" y1="152" x2="448" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.92"/>
    </linearGradient>
    <radialGradient id="core-glow" cx="256" cy="256" r="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#38BDF8" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0B0F17" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#F8FAFC" stroke-width="0.75" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Outer Chassis -->
  <rect x="8" y="8" width="496" height="496" rx="96" fill="url(#bg-grad)" stroke="#1E293B" stroke-width="2"/>
  <rect x="8" y="8" width="496" height="496" rx="96" fill="url(#grid)"/>
  <circle cx="256" cy="256" r="180" fill="url(#core-glow)"/>

  <!-- Precision Outer Telemetry Ring -->
  <polygon points="256,44 439,150 439,362 256,468 73,362 73,150" fill="none" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="6 6"/>
  <polygon points="256,64 422,160 422,352 256,448 90,352 90,160" fill="none" stroke="#334155" stroke-width="1"/>

  <!-- Upper & Lower Mesh Routing Arcs -->
  <path d="M 148 176 C 200 112, 312 112, 364 176" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="5 5" stroke-opacity="0.65"/>
  <path d="M 148 336 C 200 400, 312 400, 364 336" fill="none" stroke="#10B981" stroke-width="2" stroke-dasharray="5 5" stroke-opacity="0.65"/>

  <!-- Left Isometric Hex Node (Agent Ingress) -->
  <g>
    <polygon points="148,164 216,204 216,308 148,348 80,308 80,204" fill="url(#hex-left)" stroke="#38BDF8" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="148,188 196,216 196,296 148,324 100,296 100,216" fill="#0B0F17" fill-opacity="0.7" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.5"/>
    <!-- Isometric Cube Inner Lines -->
    <line x1="148" y1="188" x2="148" y2="256" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.6"/>
    <line x1="100" y1="296" x2="148" y2="256" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.6"/>
    <line x1="196" y1="296" x2="148" y2="256" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.6"/>
    <circle cx="148" cy="256" r="10" fill="#0B0F17" stroke="#38BDF8" stroke-width="3"/>
    <circle cx="148" cy="256" r="4" fill="#F8FAFC"/>
  </g>

  <!-- Right Isometric Hex Node (Remote Host / VFS / P2P) -->
  <g>
    <polygon points="364,164 432,204 432,308 364,348 296,308 296,204" fill="url(#hex-right)" stroke="#10B981" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="364,188 412,216 412,296 364,324 316,296 316,216" fill="#0B0F17" fill-opacity="0.7" stroke="#10B981" stroke-width="1.2" stroke-opacity="0.5"/>
    <!-- Isometric Cube Inner Lines -->
    <line x1="364" y1="188" x2="364" y2="256" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.6"/>
    <line x1="316" y1="296" x2="364" y2="256" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.6"/>
    <line x1="412" y1="296" x2="364" y2="256" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.6"/>
    <circle cx="364" cy="256" r="10" fill="#0B0F17" stroke="#10B981" stroke-width="3"/>
    <circle cx="364" cy="256" r="4" fill="#F8FAFC"/>
  </g>

  <!-- Encrypted Signal Bridge Beam -->
  <g>
    <!-- Parallel Rail Channels -->
    <line x1="196" y1="236" x2="316" y2="236" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.8"/>
    <line x1="158" y1="256" x2="354" y2="256" stroke="url(#beam-amber)" stroke-width="5" stroke-linecap="round"/>
    <line x1="196" y1="276" x2="316" y2="276" stroke="#10B981" stroke-width="2" stroke-opacity="0.8"/>

    <!-- Bridge Truss Crossbars -->
    <line x1="216" y1="236" x2="236" y2="256" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.7"/>
    <line x1="236" y1="256" x2="216" y2="276" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.7"/>
    <line x1="296" y1="236" x2="276" y2="256" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.7"/>
    <line x1="276" y1="256" x2="296" y2="276" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.7"/>

    <!-- Central Cipher Nexus Diamond -->
    <polygon points="256,214 292,256 256,298 220,256" fill="#0B0F17" stroke="#F59E0B" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="256,228 278,256 256,284 234,256" fill="#F59E0B" fill-opacity="0.2" stroke="#F8FAFC" stroke-width="1.5"/>
    <circle cx="256" cy="256" r="6" fill="#F59E0B"/>
    <circle cx="256" cy="256" r="2.5" fill="#F8FAFC"/>
  </g>

  <!-- Signal Nodes on Arcs -->
  <circle cx="256" cy="128" r="6" fill="#0B0F17" stroke="#38BDF8" stroke-width="2.5"/>
  <circle cx="256" cy="384" r="6" fill="#0B0F17" stroke="#10B981" stroke-width="2.5"/>
  <line x1="256" y1="134" x2="256" y2="214" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3 3" stroke-opacity="0.6"/>
  <line x1="256" y1="298" x2="256" y2="378" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3 3" stroke-opacity="0.6"/>

  <!-- Precision Corner Telemetry Markers -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.5">
    <text x="256" y="96" text-anchor="middle" fill="#38BDF8">SFTP-VFS // SSH</text>
    <text x="256" y="426" text-anchor="middle" fill="#10B981">UDP :42424 MESH</text>
  </g>
</svg>
