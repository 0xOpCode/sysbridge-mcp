      <stop offset="0%" stop-color="#FFF5F7"/>
      <stop offset="50%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <linearGradient id="logoRainbow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF9EBB"/>
      <stop offset="35%" stop-color="#FFC085"/>
      <stop offset="70%" stop-color="#8CE99A"/>
      <stop offset="100%" stop-color="#85D8FF"/>
