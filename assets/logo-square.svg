  <rect x="116" y="402" width="280" height="52" rx="26" fill="#FFFFFF" stroke="#334155" stroke-width="4"/>
  <text x="256" y="436" text-anchor="middle" font-family="'DejaVu Sans', sans-serif" font-size="25" font-weight="800" fill="#1E293B">sysbridge-mcp</text>
