  </defs>

  <!-- Rounded Kawaii App Tile -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#logoBg)" stroke="#F9A8D4" stroke-width="8"/>

  <!-- Soft Sun Glow -->
  <circle cx="256" cy="240" r="145" fill="#FEF3C7" fill-opacity="0.8"/>

